<svg xmlns="http://www.w3.org/2000/svg" width="620" height="328" viewBox="0 0 620 328" role="img" aria-label="Does the retrieval stack earn its complexity?"><rect width="620" height="328" fill="#ffffff" rx="8"/><text x="24.0" y="34.0" font-size="17" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Does the retrieval stack earn its complexity?</text><text x="24.0" y="56.0" font-size="12.5" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">18 golden queries, computed live by this script</text><text x="190.0" y="86.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">rank of the right passage</text><text x="355.0" y="86.0" font-size="11" fill="#b7791f" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">right on the first try</text><text x="178.0" y="116.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">bm25 only</text><rect x="190.0" y="103.0" width="300.0" height="9" fill="#e4e7eb" rx="2"/><rect x="190.0" y="103.0" width="187.5" height="9" fill="#2b6cb0" rx="2"/><text x="384.5" y="111.0" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0.625</text><rect x="190.0" y="114.0" width="300.0" height="9" fill="#e4e7eb" rx="2"/><rect x="190.0" y="114.0" width="116.7" height="9" fill="#b7791f" rx="2"/><text x="313.7" y="122.0" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0.389</text><text x="178.0" y="160.0" font-