" rx="2"/><rect x="190.0" y="235.0" width="218.5" height="9" fill="#2b6cb0" rx="2"/><text x="415.5" y="243.0" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0.728</text><rect x="190.0" y="246.0" width="300.0" height="9" fill="#e4e7eb" rx="2"/><rect x="190.0" y="246.0" width="166.7" height="9" fill="#b7791f" rx="2"/><text x="363.7" y="254.0" font-size="10.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0.556</text><text x="24.0" y="286.0" font-size="11.5" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Fusing the two beats either alone. The reranker adds 0.009 — one query, one position.</text><text x="24.0" y="306.0" font-size="11.5" fill="#c05621" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Read with the caveat: the corpus is 23 chunks and they are the project's own knowledge base.</text></svg>