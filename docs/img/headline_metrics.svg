<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" role="img" aria-label="The two numbers that matter"><rect width="620" height="420" fill="#ffffff" rx="8"/><text x="24.0" y="34.0" font-size="17" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">The two numbers that matter</text><text x="24.0" y="56.0" font-size="12.5" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Same eighteen measurement tools, driven two different ways</text><text x="24.0" y="92.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">False alarms on look-alikes</text><text x="24.0" y="110.0" font-size="11.5" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">lower is better — a crew sent to a healthy array</text><line x1="245.0" y1="122.0" x2="245.0" y2="230.0" stroke="#7b8794" stroke-width="1" stroke-dasharray="3 3"/><text x="251.0" y="232.0" font-size="10.5" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">target ≤ 0.15</text><text x="188.0" y="146.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">rules baseline</text><rect x="200.0" y="133.0" width="300.0" height="18" fill="#e4e7eb" rx="3"/><rect x="200.0" y="133.0" width="16.8" height="18" fill="#7b8794" rx="3"/><text x="224.8" y="146.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0.056</text><text x="188.0" y="180.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">agent, before</text><rect x="200.0" y="167.0" width="300.0" height="18" fill="#e4e7eb" rx="3"/><rect x="200.0" y="167.0" width="150.0" height="18" fill="#c05621" rx="3"/><text x="358.0" y="180.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0.500</text><text x="188.0" y="214.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">agent, after</text><rect x="200.0" y="201.0" width="300.0" height="18" fill="#e4e7eb" rx="3"/><rect x="200.0" y="201.0" width="2.0" height="18" fill="#2f855a" rx="3"/><text x="210.0" y="214.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0.000</text><text x="24.0" y="242.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Correct "not enough evidence"</text><text x="24.0" y="260.0" font-size="11.5" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">higher is better — refusing to guess when the data cannot decide</text><line x1="410.0" y1="272.0" x2="410.0" y2="380.0" stroke="#7b8794" stroke-width="1" stroke-dasharray="3 3"/><text x="416.0" y="382.0" font-size="10.5" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">target ≥ 0.70</text><text x="188.0" y="296.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">rules baseline</text><rect x="200.0" y="283.0" width="300.0" height="18" fill="#e4e7eb" rx="3"/><rect x="200.0" y="283.0" width="2.0" height="18" fill="#7b8794" rx="3"/><text x="210.0" y="296.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0.000</text><text x="188.0" y="330.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">agent, before</text><rect x="200.0" y="317.0" width="300.0" height="18" fill="#e4e7eb" rx="3"/><rect x="200.0" y="317.0" width="300.0" height="18" fill="#2f855a" rx="3"/><text x="508.0" y="330.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">1.000</text><text x="188.0" y="364.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">agent, after</text><rect x="200.0" y="351.0" width="300.0" height="18" fill="#e4e7eb" rx="3"/><rect x="200.0" y="351.0" width="300.0" height="18" fill="#2f855a" rx="3"/><text x="508.0" y="364.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">1.000</text><text x="24.0" y="396.0" font-size="11" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Rules baseline: 43 held-back cases. Agent: eight tuning cases — a debugging run, not a score.</text></svg>