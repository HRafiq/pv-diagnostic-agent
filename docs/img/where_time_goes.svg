<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-label="Where an investigation spends its time"><rect width="620" height="300" fill="#ffffff" rx="8"/><text x="24.0" y="34.0" font-size="17" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Where an investigation spends its time</text><text x="24.0" y="56.0" font-size="12.5" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">13 timed runs, read off trace files rather than estimated</text><text x="178.0" y="114.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">synthesiser</text><rect x="190.0" y="100.0" width="330.0" height="20" fill="#e4e7eb" rx="3"/><rect x="190.0" y="100.0" width="165.7" height="20" fill="#2b6cb0" rx="3"/><text x="363.7" y="114.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">50.2%</text><text x="178.0" y="150.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">planner</text><rect x="190.0" y="136.0" width="330.0" height="20" fill="#e4e7eb" rx="3"/><rect x="190.0" y="136.0" width="73.9" height="20" fill="#2b6cb0" rx="3"/><text x="271.9" y="150.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">22.4%</text><text x="178.0" y="186.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">router + measure</text><rect x="190.0" y="172.0" width="330.0" height="20" fill="#e4e7eb" rx="3"/><rect x="190.0" y="172.0" width="58.7" height="20" fill="#7b8794" rx="3"/><text x="256.7" y="186.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">17.8%</text><text x="178.0" y="222.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">look up</text><rect x="190.0" y="208.0" width="330.0" height="20" fill="#e4e7eb" rx="3"/><rect x="190.0" y="208.0" width="32.0" height="20" fill="#7b8794" rx="3"/><text x="230.0" y="222.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">9.7%</text><text x="24.0" y="256.0" font-size="12" fill="#c05621" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">48% of all time and half of all spend went after the first cycle — re-reviewing.</text><text x="24.0" y="278.0" font-size="11" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">The measurements themselves are pure functions and take milliseconds. None of this is the physics.</text></svg>