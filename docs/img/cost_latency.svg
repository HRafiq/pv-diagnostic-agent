ont-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Time per case</text><text x="324.0" y="114.0" font-size="11" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">first working runs</text><rect x="324" y="122.0" width="230.0" height="16" fill="#e4e7eb" rx="3"/><rect x="324" y="122.0" width="230.0" height="16" fill="#7b8794" rx="3"/><text x="562.0" y="135.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">574s</text><text x="324.0" y="148.0" font-size="11" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">now</text><rect x="324" y="156.0" width="230.0" height="16" fill="#e4e7eb" rx="3"/><rect x="324" y="156.0" width="78.5" height="16" fill="#2f855a" rx="3"/><text x="410.5" y="169.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">196s</text><text x="24.0" y="214.0" font-size="11" fill="#7b8794" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Design target was $0.15 a question. It is not met, and the README says so.</text></svg>