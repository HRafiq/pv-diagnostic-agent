# LLM model per agent node.
#
# There is no `temperature` here on purpose. temperature/top_p/top_k were
# REMOVED on Claude Opus 5, Sonnet 5, Opus 4.8 and Opus 4.7 — sending any of
# them returns HTTP 400. Reasoning depth is steered with `effort` instead.
# See docs/DECISION.md#0004.
#
# Profiles let the cost/quality experiment in eval §5.4 be a config change
# rather than a code change. Select with PV_MODEL_PROFILE in .env.

active_profile: default

# Published list prices, USD per million tokens. Used by the cost accounting in
# src/trace/ — the agent never sees these.
pricing:
  claude-opus-5:      { input: 5.00, output: 25.00 }
  claude-sonnet-5:    { input: 3.00, output: 15.00, note: "intro $2.00/$10.00 through 2026-08-31" }
  claude-haiku-4-5:   { input: 1.00, output: 5.00 }

profiles:

  # Cost-tuned. The target is a median <= $0.15 per question (eval §5.6), which
  # is only reachable with prompt caching on the stable system + tool-schema
  # prefix, so `cache_system_prompt` is on everywhere it pays for itself.
  default:
    # NOTE on max_tokens throughout: it is a *ceiling*, not a reservation.
    # Cost tracks tokens actually generated, so a generous cap costs nothing on
    # replies that already fitted. It also bounds thinking and the reply
    # together — the original 8000 here was enough for neither at effort=high,
    # and truncated the synthesiser's answer mid-sentence on the first real run.
    planner:
      model: claude-sonnet-5
      effort: high            # enumerating causes is the reasoning-heavy step
      thinking: adaptive
      max_tokens: 16000
      cache_system_prompt: true
    router:
      model: claude-haiku-4-5 # called most often, decides least
      effort: null            # NOTE: Haiku 4.5 rejects `effort` — must stay null
      thinking: null          # Haiku 4.5 uses legacy budget_tokens; off is fine
      max_tokens: 1500
      cache_system_prompt: true
    synthesizer:
      model: claude-sonnet-5
      effort: high
      thinking: adaptive
      # The longest reply in the loop: title, summary, full answer, evidence
      # ledger and candidate causes, on top of adaptive thinking.
      max_tokens: 32000
      cache_system_prompt: true
    critic:
      model: claude-sonnet-5  # a weak critic is worse than no critic (§3.5)
      effort: high
      thinking: adaptive
      # Matches the synthesiser, and for the same reason. The critic re-reads
      # every measurement, the draft and the look-alike checklist, then writes
      # exclusions with reasoning for each — at effort=high its thinking alone
      # can outrun what the draft cost to produce. 16000 truncated it mid-reply
      # on a case the agent had answered correctly twice, and a truncated critic
      # fails the whole case rather than the review.
      max_tokens: 32000
      cache_system_prompt: true

  # Latency-tuned, and NOT the default until it has been measured against one.
  #
  # A profile rather than an edit to `default` on purpose. Every speed decision
  # in this project so far was made from an estimate — count the calls in a log,
  # multiply by a guessed per-call latency, argue from the product — and the
  # point of `eval/runner.py profile` is to stop doing that. Lowering `effort`
  # is a quality trade, so it gets measured rather than assumed:
  #
  #   PV_MODEL_PROFILE=fast python -m eval.runner run --engine agent \
  #       --only G-017 --resume runs/fast.jsonl
  #
  # then `profile` both runs and compare. If accuracy holds, promote it.
  #
  # What changed and why, per node:
  #  - planner: effort high -> medium. Enumerating candidate causes is bounded
  #    work; the tool catalogue and the look-alike lines do most of the framing.
  #  - synthesiser: left at high. It writes the answer a plant manager reads and
  #    is the node least worth degrading.
  #  - critic: high -> medium. The node whose value is least established — it
  #    has helped once and destroyed a correct answer four times — so it is the
  #    cheapest place to spend less while that is being settled.
  fast:
    planner:     { model: claude-sonnet-5, effort: medium, thinking: adaptive, max_tokens: 12000, cache_system_prompt: true }
    router:      { model: claude-haiku-4-5, effort: null, thinking: null, max_tokens: 1500, cache_system_prompt: true }
    synthesizer: { model: claude-sonnet-5, effort: high, thinking: adaptive, max_tokens: 32000, cache_system_prompt: true }
    critic:      { model: claude-sonnet-5, effort: medium, thinking: adaptive, max_tokens: 32000, cache_system_prompt: true }

  # Upper bound on quality, for the cost/quality frontier in docs/FINDINGS.md.
  # Expect roughly 3-5x the cost of `default`.
  quality:
    planner:     { model: claude-opus-5, effort: xhigh, thinking: adaptive, max_tokens: 32000, cache_system_prompt: true }
    router:      { model: claude-sonnet-5, effort: low, thinking: disabled, max_tokens: 4000, cache_system_prompt: true }
    synthesizer: { model: claude-opus-5, effort: xhigh, thinking: adaptive, max_tokens: 48000, cache_system_prompt: true }
    critic:      { model: claude-opus-5, effort: high,  thinking: adaptive, max_tokens: 48000, cache_system_prompt: true }

# Circuit breakers, enforced client-side before each call — NOT budgets. The
# distinction matters and was got wrong: `BudgetExceeded` aborts the whole
# evaluation by design (it means the loop is not terminating), so a breaker set
# below the intended operating point does not save money. It converts an
# ordinary expensive case into a dead run.
#
# The arithmetic, measured rather than assumed. One cycle at 12 tools is about
# 18 LLM calls -- 15 router turns (one per measurement, one per knowledge
# look-up, one to stop) plus planner, synthesiser and critic -- and roughly
# $0.70, of which the router's share is small because it is Haiku. Four cycles
# is the §3.5 allowance, so ~72 calls and ~$2.80 is what this configuration
# permits *by construction*.
#
# The old $1.00 sat below that: it was set when the design target was $0.15 per
# question, and one measured cycle is $0.65. Two legitimate cycles tripped it
# and killed the run. These now sit above the allowance, so they fire only on a
# genuine runaway. Median cost is not managed here — it is managed by making
# extra cycles unnecessary, which is what the review fixes are for.
limits:
  max_llm_calls_per_investigation: 80
  max_cost_usd_per_investigation: 3.50
  max_planner_critic_cycles: 4      # §3.5 hard cap
  # Raised from 8. Full look-alike coverage costs five well-chosen
  # measurements, so at 8 the agent had three left for the question it was
  # asked — and it spent them on coverage, then abstained naming a tool it
  # owned and had not run. See docs/DECISION.md#0067.
  max_tools_per_cycle: 12
  request_timeout_seconds: 300

# LLM responses are cached by (model, prompt_hash) so regression runs compare
# like with like despite LLM non-determinism. See CLAUDE.md#determinism.
response_cache:
  enabled: true
  path: traces/llm_cache
